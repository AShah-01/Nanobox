name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-check:
    # Fast feedback (no Rust toolchain, no native build) — type-check,
    # unit tests, and the Vite production bundle. Runs in ~1-2 min vs. the
    # ~15-20 min full Tauri build below, so PRs get a quick signal without
    # waiting on both native bundlers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build frontend bundle
        run: npx vite build

  build:
    needs: frontend-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit

      # Deliberately NOT `-- --debug`: a debug build keeps the console
      # subsystem on Windows (see src-tauri/src/main.rs), which makes the
      # app auto-open a console window and die if that window is closed --
      # exactly the "app doesn't work if the terminal is closed" bug users
      # hit when running one of these artifacts. Building in release mode
      # here gives out the same GUI-subsystem binary `npm run tauri build`
      # produces locally, so it isn't tied to any console/terminal.
      - name: Build Tauri app (release)
        run: npm run tauri build

      - name: Upload build artifact (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nanobox-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload build artifact (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nanobox-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
