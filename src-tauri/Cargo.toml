[package]
name = "nanobox"
version = "0.1.0"
description = "Nanobox — a fully customisable desktop companion built for neurodivergent people"
authors = ["Aagam Shah"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nanobox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
base64 = "0.23.1"

# Icon extraction (Part A of the "Error 6" fix) is Windows-only for now — see
# src-tauri/src/icons.rs. windows-icons pulls in the `windows` crate's Win32
# bindings, which don't link on non-Windows targets, so it's scoped to a
# target-specific dependency table rather than the shared [dependencies].
[target.'cfg(target_os = "windows")'.dependencies]
windows-icons = "0.4.0"

# System media-session reading ("Error 7/8" fix) is also Windows-only for now
# — see src-tauri/src/system_media.rs. Kept as its own table (rather than
# merged into the one above) since `cfg(windows)` and `cfg(target_os =
# "windows")` are different predicate strings even though both match the
# same platform; Cargo merges dependencies from every matching target table.
[target."cfg(windows)".dependencies]
pollster = "1.0.1"
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Storage_Streams", "Win32_System_Com"] }
windows-future = "0.3.2"

